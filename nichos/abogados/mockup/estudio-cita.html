<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Ejemplo & Asociados — Sucesiones y divorcios exprés</title>
<meta name="description" content="Sucesiones y divorcios de común acuerdo. Atención con cita previa.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F1E9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   0. NOTAS DE ARQUITECTURA
   Molde de una pantalla para estudios jurídicos que atienden con cita previa
   y prefieren la llamada al chat. Todo el contenido de negocio vive en
   PROSPECTO; el diseño, en CONFIG (al tope del <script>). Personalizar para
   otro estudio = editar sólo esos dos objetos.
   Los colores se aplican en runtime desde CONFIG.colores (claro y oscuro),
   ya con contraste AA medido: no se derivan, se eligen.
   ========================================================================== */

:root{
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

  --text-xs:   clamp(0.8rem, 0.78rem + 0.1vw, 0.86rem);
  --text-sm:   clamp(0.92rem, 0.9rem + 0.12vw, 0.98rem);
  --text-base: clamp(1.0625rem, 1.04rem + 0.12vw, 1.125rem);
  --text-md:   clamp(1.2rem, 1.12rem + 0.35vw, 1.4rem);
  --text-lg:   clamp(1.45rem, 1.3rem + 0.7vw, 1.85rem);
  --text-hero: clamp(2.1rem, 1.55rem + 2.6vw, 3.6rem);

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --radio: 14px;
  --radio-chico: 8px;
  --ancho: 1240px;

  /* Valores por defecto = CONFIG.colores.claro; applyColores() los pisa. */
  --fondo: #F6F1E9;
  --superficie: #FFFCF7;
  --texto: #1F1B16;
  --texto-sec: #5C544A;
  --acento: #A3412A;
  --acento-texto: #FFFFFF;
  --segundo: #3F5A4C;
  --borde: #E2D8C9;
  --trama: rgba(63, 90, 76, .07);
}

*,*::before,*::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.55;
  color: var(--texto);
  background: var(--fondo);
  -webkit-font-smoothing: antialiased;
}
a{ color: inherit; }
:focus-visible{ outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 4px; }
svg{ flex-shrink: 0; }
.sr-only{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Trama opcional (CONFIG.trama): cuadrícula con una diagonal, muy tenue. */
body.con-trama{
  background-image:
    linear-gradient(var(--trama) 1px, transparent 1px),
    linear-gradient(90deg, var(--trama) 1px, transparent 1px);
  background-size: 56px 56px;
  background-attachment: fixed;
}
body.con-trama::before{
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--trama) 50%, transparent calc(50% + 1px));
}

/* ==========================================================================
   1. BARRA
   ========================================================================== */
.barra{
  max-width: var(--ancho); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s4);
  padding: var(--s4) var(--s4);
}
.marca{ display: flex; align-items: center; gap: var(--s3); text-decoration: none; min-width: 0; }
.marca img{ height: 44px; width: auto; display: block; }
.marca-texto{ font-family: var(--font-display); font-size: var(--text-md); line-height: 1.1; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.marca-texto em{ font-style: italic; font-weight: 400; color: var(--texto-sec); }
.marca-texto em b{ font-weight: 500; color: var(--acento); }
.barra-tel{
  display: inline-flex; align-items: center; gap: var(--s2);
  min-height: 44px; min-width: 44px; justify-content: center;
  padding: 0 var(--s3); border: 1px solid var(--borde); border-radius: 999px;
  background: var(--superficie); text-decoration: none; font-weight: 600; font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
}
.barra-tel svg{ color: var(--acento); }
.barra-tel span{ display: none; }

/* ==========================================================================
   2. PANTALLA (grilla)
   ========================================================================== */
.pantalla{
  max-width: var(--ancho); margin: 0 auto;
  padding: var(--s3) var(--s4) var(--s6);
  display: grid; gap: var(--s6);
  grid-template-areas: "hero" "tramites" "otros" "confianza" "mapa";
}
.hero{ grid-area: hero; }
.tramites{ grid-area: tramites; }
.otros{ grid-area: otros; }
.confianza{ grid-area: confianza; }
.mapa{ grid-area: mapa; }
.mapa:empty{ display: none; }

/* ---------- Hero ---------- */
.antetitulo{
  margin: 0 0 var(--s3); font-size: var(--text-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--segundo);
}
.hero h1{
  margin: 0; font-family: var(--font-display); font-size: var(--text-hero);
  line-height: 1.04; font-weight: 600; letter-spacing: -.02em; text-wrap: balance;
  font-variation-settings: "opsz" 120;
}
.hero h1 em{ font-style: italic; font-weight: 500; color: var(--acento); }
.bajada{ margin: var(--s4) 0 0; max-width: 34ch; color: var(--texto-sec); font-size: var(--text-md); line-height: 1.45; }

.cta{
  margin-top: var(--s5);
  display: inline-flex; align-items: center; gap: var(--s3);
  min-height: 56px; padding: var(--s3) var(--s5) var(--s3) var(--s4);
  background: var(--acento); color: var(--acento-texto);
  border-radius: var(--radio); text-decoration: none;
  box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 8px 24px -12px var(--acento);
  transition: transform .2s ease, box-shadow .2s ease;
}
.cta-icono{ display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.16); }
.cta-textos{ display: flex; flex-direction: column; line-height: 1.2; }
.cta-textos strong{ font-size: var(--text-base); font-weight: 700; }
.cta-textos span{ font-size: var(--text-md); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
@media (hover: hover){ .cta:hover{ transform: translateY(-2px); box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 14px 28px -12px var(--acento); } }

.aviso-cita{ margin: var(--s3) 0 0; display: flex; align-items: center; gap: var(--s2); font-weight: 600; font-size: var(--text-sm); }
.aviso-cita svg{ color: var(--segundo); }
.honorarios{ margin: var(--s2) 0 0; font-size: var(--text-sm); color: var(--texto-sec); max-width: 46ch; }
.wa-link{
  margin-top: var(--s4); display: inline-flex; align-items: center; gap: var(--s2);
  min-height: 44px; font-size: var(--text-sm); color: var(--texto-sec);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.wa-link:hover{ color: var(--texto); }

/* ---------- Trámites protagonistas ---------- */
.tramites{ display: grid; gap: var(--s4); align-content: start; }
.tramite{
  position: relative; display: flex; flex-direction: column;
  background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: var(--s5); transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
.tramite-cabeza{ display: flex; align-items: center; gap: var(--s3); }
.tramite-icono{ display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--segundo); color: var(--superficie); }
.tramite h2{ margin: 0; font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.1; font-weight: 600; letter-spacing: -.01em; }
.tramite h2 em{ font-style: italic; font-weight: 500; color: var(--acento); }
.cuando{ margin: var(--s3) 0 0; color: var(--texto-sec); }
.pasos{ list-style: none; margin: var(--s4) 0 0; padding: 0; display: grid; gap: var(--s2); counter-reset: paso; }
.pasos li{ display: grid; grid-template-columns: 28px 1fr; gap: var(--s3); align-items: start; font-size: var(--text-sm); line-height: 1.45; }
.pasos li::before{
  counter-increment: paso; content: counter(paso);
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--segundo); color: var(--segundo); font-weight: 700; font-size: var(--text-xs);
}
.papeles{ margin-top: var(--s4); border-top: 1px dashed var(--borde); padding-top: var(--s3); font-size: var(--text-sm); }
.papeles summary{ cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; gap: var(--s2); list-style: none; }
.papeles summary::-webkit-details-marker{ display: none; }
.papeles summary svg{ transition: transform .2s ease; color: var(--segundo); }
.papeles[open] summary svg{ transform: rotate(90deg); }
.papeles ul{ margin: 0 0 var(--s2); padding-left: 1.2em; color: var(--texto-sec); }
.papeles li + li{ margin-top: 2px; }
.tramite-accion{
  margin-top: auto; padding-top: var(--s4);
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px;
  font-weight: 700; color: var(--acento); text-decoration: none;
}
.tramite-accion svg{ transition: transform .2s ease; }
/* Toda la tarjeta lleva a la llamada; los <details> quedan por encima. */
.tramite-accion::after{ content: ""; position: absolute; inset: 0; border-radius: var(--radio); }
.papeles{ position: relative; z-index: 1; }
@media (hover: hover){
  .tramite:hover{ border-color: var(--acento); box-shadow: 0 18px 40px -28px rgba(0,0,0,.45); transform: translateY(-2px); }
  .tramite:hover .tramite-accion svg{ transform: translateX(4px); }
}

/* ---------- Secundarios y "otro caso" ---------- */
.otros{ display: grid; gap: var(--s3); }
.secundarios{ margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s4); }
.secundarios-intro{ font-size: var(--text-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-sec); }
.secundario strong{ font-weight: 700; }
.secundario span{ color: var(--texto-sec); }
.otro-caso{ margin: 0; font-family: var(--font-display); font-size: var(--text-md); font-weight: 500; }
.otro-caso a{ color: var(--acento); font-style: italic; text-underline-offset: 4px; }

/* ---------- Confianza ---------- */
.confianza{
  display: grid; gap: var(--s4);
  border-top: 1px solid var(--borde); padding-top: var(--s5);
}
.fila{ display: grid; grid-template-columns: 22px 1fr; gap: var(--s3); align-items: start; }
.fila > svg{ margin-top: 2px; color: var(--segundo); }
.fila-titulo{ display: block; font-size: var(--text-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-sec); }
.fila-valor{ display: block; font-weight: 600; }
.fila-valor a{ text-underline-offset: 3px; }
.estrellas{ display: inline-flex; gap: 2px; vertical-align: -2px; margin-right: var(--s2); color: var(--acento); }
.resena{ margin: var(--s2) 0 0; font-family: var(--font-display); font-style: italic; font-size: var(--text-md); line-height: 1.3; }
.resena-autor{ display: block; margin-top: var(--s1); font-size: var(--text-xs); color: var(--texto-sec); }

.cercania{ display: block; margin-top: var(--s1); font-size: var(--text-sm); font-weight: 600; color: var(--segundo); }
.mapa{ height: 220px; border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; background: var(--superficie); }
.mapa iframe{ display: block; width: 100%; height: 100%; border: 0; }

/* ---------- Marcadores de lo que falta confirmar ---------- */
.a-confirmar{
  display: inline-block; margin-left: var(--s2); padding: 1px 7px; vertical-align: 2px;
  border: 1px dashed var(--texto-sec); border-radius: 999px;
  font-family: var(--font-body); font-style: normal; font-size: 0.72rem; font-weight: 600; letter-spacing: .02em;
  color: var(--texto-sec); white-space: nowrap;
}
.dato-forma{ text-decoration: underline dotted var(--texto-sec); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }

/* ==========================================================================
   3. CIERRE
   ========================================================================== */
.cierre{ border-top: 1px solid var(--borde); background: var(--superficie); }
.cierre-in{ max-width: var(--ancho); margin: 0 auto; padding: var(--s6) var(--s4); display: grid; gap: var(--s3); }
.cierre h2{ margin: 0; font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; line-height: 1.15; }
.cierre .cta{ margin-top: var(--s2); justify-self: start; }
.letra-chica{ margin: var(--s4) 0 0; font-size: var(--text-xs); color: var(--texto-sec); }

/* ==========================================================================
   4. ESCRITORIO
   ========================================================================== */
@media (min-width: 640px){
  .barra-tel span{ display: inline; }
}
@media (min-width: 760px){
  .tramites{ grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1080px){
  .barra{ padding: var(--s5) var(--s6) var(--s3); }
  .pantalla{
    padding: var(--s5) var(--s6) var(--s7);
    grid-template-columns: minmax(0, .95fr) minmax(0, 1.25fr);
    grid-template-rows: auto auto auto 1fr;
    grid-template-areas: "hero tramites" "hero confianza" "otros confianza" "mapa confianza";
    column-gap: var(--s8); row-gap: var(--s5);
    align-items: start;
  }
  .hero{ padding-top: var(--s4); }
  .otros{ border-top: 1px solid var(--borde); padding-top: var(--s4); }
  .confianza{ grid-template-columns: 1fr 1fr; column-gap: var(--s5); }
  .fila-opiniones{ grid-column: 2; grid-row: 1 / span 2; }
  .mapa{ height: 190px; align-self: start; width: 100%; }
  .cierre-in{ grid-template-columns: 1fr auto; align-items: center; padding: var(--s5) var(--s6); }
  .cierre .cta{ margin-top: 0; grid-row: 1 / span 2; grid-column: 2; }
  .cierre .letra-chica{ grid-column: 1 / -1; }
}

/* ==========================================================================
   5. MOVIMIENTO (sólo si el usuario no pidió reducirlo)
   ========================================================================== */
@media (prefers-reduced-motion: no-preference){
  .animar .entra{ opacity: 0; transform: translateY(10px); animation: entra .4s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
  .animar .pasos li{ opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease; transition-delay: calc(var(--i, 0) * 80ms); }
  .animar .visible .pasos li{ opacity: 1; transform: none; }
}
@keyframes entra{ to{ opacity: 1; transform: none; } }
</style>
</head>
<body>

<header class="barra" id="barra"></header>

<main class="pantalla">
  <section class="hero" id="hero" aria-labelledby="titulo"></section>
  <section class="tramites" id="tramites" aria-label="Trámites principales"></section>
  <section class="otros" id="otros" aria-label="Otras materias"></section>
  <aside class="confianza" id="confianza" aria-label="Quiénes somos y dónde estamos"></aside>
  <div class="mapa" id="mapa"></div>
</main>

<footer class="cierre"><div class="cierre-in" id="cierre"></div></footer>

<script>
/* ============================================================================
   PROSPECTO — contenido del estudio. Es lo único que se edita por cliente.
   Todo lo marcado `confirmado: false` se pinta con la etiqueta "a confirmar".
   Los datos de este molde son DE EJEMPLO: nombre, teléfonos, dirección y la
   reseña no corresponden a ningún estudio real.
   ============================================================================ */
const PROSPECTO = {
  nombre: "Estudio Ejemplo & Asociados",
  // Wordmark en texto si no hay logo: `principal` en peso alto, `resto` liviano;
  // el "&" del resto toma el color de acento.
  marca: { principal: "Ejemplo", resto: "& Asociados" },
  logo: null, // ruta a un SVG/PNG; si existe, reemplaza al wordmark
  logoOscuro: null, // versión en negativo para modo oscuro
  favicon: null, // ruta al monograma

  antetitulo: "Estudio jurídico · Calle Ejemplo 000",
  // Entre *asteriscos* va la palabra que se destaca en el título.
  titulo: "Sucesiones y divorcios *exprés* en Ciudad Ejemplo.",
  bajada: "Si están de acuerdo, el trámite es más simple. Llamanos, pedí una cita y te decimos qué papeles traer.",

  // Canal principal: la llamada para pedir cita.
  telefonoCita: { display: "000 000-0000", tel: "+540000000000" },
  avisoCita: "Atendemos solo con cita previa",
  ctaTexto: "Llamá para pedir cita",

  // null = no se muestra la línea.
  honorarios: { texto: "La consulta tiene honorarios según la ley; te los decimos al pedir la cita.", confirmado: false },

  // Canal secundario. mostrar: false lo saca de toda la página.
  whatsapp: {
    mostrar: true,
    numero: "5490000000000", // formato wa.me, sin + ni espacios
    texto: "¿No podés llamar ahora? Escribinos para coordinar la cita",
    mensaje: "Hola, quiero pedir una cita. Mi tema es: ",
  },

  tramites: [
    {
      icono: "casa",
      titulo: "Sucesión *exprés*",
      cuando: "Cuando los herederos están de acuerdo.",
      pasos: [
        "Juntamos los papeles con vos.",
        "Iniciamos la sucesión en el juzgado y se publica el edicto.",
        "Declaratoria de herederos e inscripción de los bienes.",
      ],
      papeles: [
        "Partida de defunción",
        "Partidas que prueban el vínculo de cada heredero",
        "DNI de cada heredero",
        "Papeles de los bienes (escrituras, título del auto)",
      ],
      accion: "Pedir cita por una sucesión",
    },
    {
      icono: "anillos",
      titulo: "Divorcio *exprés*",
      cuando: "Cuando los dos están de acuerdo.",
      pasos: [
        "Ponemos por escrito el acuerdo sobre casa, bienes e hijos.",
        "Presentación conjunta en el juzgado de familia.",
        "Sentencia de divorcio.",
      ],
      papeles: [
        "DNI de los dos",
        "Partida de matrimonio actualizada",
        "Partidas de nacimiento de los hijos, si hay",
      ],
      accion: "Pedir cita por un divorcio",
    },
  ],

  secundarios: {
    intro: "También",
    items: [
      { nombre: "Laboral", detalle: "despidos, accidentes de trabajo", confirmado: false },
      { nombre: "Previsional", detalle: "jubilaciones y pensiones", confirmado: false },
    ],
  },
  otroCaso: { pregunta: "¿Tu caso es otro?", accion: "Consultanos." },

  // Confianza. Nunca inventar nombre, matrícula ni reseñas.
  profesional: { etiqueta: "Profesional a cargo", nombre: "Ejemplo", confirmado: false },
  matricula: { etiqueta: "Matrícula del", colegio: "Colegio de Abogados de Ciudad Ejemplo", tomo: null, folio: null },
  rating: { valor: 5.0, total: 0, url: "https://maps.google.com/" },
  // `ejemplo: true` = reseña inventada para el molde: se pinta como tal.
  // `confirmado: false` = reseña real cuyo uso todavía no autorizó el estudio.
  resenas: [
    { texto: "Reseña de ejemplo: reemplazar por una reseña real de Google.", autor: "Nombre de ejemplo", fecha: "", ejemplo: true },
  ],
  direccion: {
    linea: "Calle Ejemplo 000",
    detalle: { texto: "Piso 0, oficina 0", confirmado: false },
    ciudad: "Ciudad Ejemplo",
    mapsQuery: "Calle Ejemplo 000, Ciudad Ejemplo",
    cercania: null, // ej. "A metros de Tribunales": solo si la distancia real lo justifica
    mapa: null, // { lat, lon }: mapa de OpenStreetMap con carga diferida
  },

  cierre: { titulo: "¿Querés empezar? Pedí tu cita." },
  letraChica: "Boceto de muestra, sin publicar.",
};

/* ============================================================================
   CONFIG — diseño del molde (no es contenido del cliente).
   ============================================================================ */
const CONFIG = {
  // Paleta "papel y terracota". Contraste medido (WCAG): texto 15,2:1,
  // texto secundario 6,6:1, acento sobre fondo 5,6:1, blanco sobre acento 6,3:1.
  colores: {
    claro: {
      fondo: "#F6F1E9", superficie: "#FFFCF7", texto: "#1F1B16", textoSec: "#5C544A",
      acento: "#A3412A", acentoTexto: "#FFFFFF", segundo: "#3F5A4C", borde: "#E2D8C9",
      trama: "rgba(63, 90, 76, .07)",
    },
    oscuro: {
      fondo: "#191512", superficie: "#221D19", texto: "#F3ECE2", textoSec: "#BDB2A4",
      acento: "#E58A6E", acentoTexto: "#1A1410", segundo: "#93B5A2", borde: "#3A322B",
      trama: "rgba(147, 181, 162, .06)",
    },
  },
  /* Paleta alternativa "verde botella y coral":
     claro:  { fondo: "#F4F6F2", superficie: "#FFFFFF", texto: "#16211C", textoSec: "#4E5A53",
               acento: "#B4472F", acentoTexto: "#FFFFFF", segundo: "#1E4D3A", borde: "#DCE3DC", trama: "rgba(30,77,58,.07)" } */
  trama: true,      // cuadrícula tenue de fondo
  animaciones: true,
};

/* ==========================================================================
   ICONOS — línea, 24x24, currentColor.
   ========================================================================== */
const ICONOS = {
  tel:     '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/>',
  chat:    '<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.4 8.4 0 1 1 21 11.5Z"/>',
  casa:    '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/>',
  anillos: '<circle cx="9" cy="13" r="6"/><circle cx="15" cy="11" r="6"/>',
  flecha:  '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
  reloj:   '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  persona: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  estrella:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z" fill="currentColor" stroke="none"/>',
  pin:     '<path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
};
function icono(nombre, t = 20){
  return `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[nombre]}</svg>`;
}

/* ==========================================================================
   RENDER — cada función lee PROSPECTO/CONFIG y escribe en su contenedor.
   ========================================================================== */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function destacar(s){ return esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>'); }
function chip(falta, texto = 'a confirmar'){ return falta ? `<span class="a-confirmar">${esc(texto)}</span>` : ''; }
const P = PROSPECTO;
const telHref = `tel:${P.telefonoCita.tel}`;
const waHref = () => `https://wa.me/${P.whatsapp.numero}?text=${encodeURIComponent(P.whatsapp.mensaje)}`;

function cta(){
  return `<a class="cta" href="${telHref}">
    <span class="cta-icono">${icono('tel', 20)}</span>
    <span class="cta-textos"><strong>${esc(P.ctaTexto)}</strong><span>${esc(P.telefonoCita.display)}</span></span>
  </a>`;
}
function linkWhatsapp(){
  if (!P.whatsapp.mostrar) return '';
  return `<a class="wa-link" href="${waHref()}" target="_blank" rel="noopener">${icono('chat', 18)} ${esc(P.whatsapp.texto)}</a>`;
}

function renderBarra(){
  const [antes, ...despues] = P.marca.resto.split('&');
  const resto = despues.length ? `${esc(antes)}<b>&amp;</b>${esc(despues.join('&'))}` : esc(P.marca.resto);
  const marca = P.logo
    ? `<img src="${esc(P.logo)}" alt="${esc(P.nombre)}">`
    : `<span class="marca-texto">${esc(P.marca.principal)} <em>${resto}</em></span>`;
  const marcaOscura = P.logo && P.logoOscuro ? `<source media="(prefers-color-scheme: dark)" srcset="${esc(P.logoOscuro)}">` : '';
  document.getElementById('barra').innerHTML = `
    <a class="marca" href="#" aria-label="${esc(P.nombre)}">${marcaOscura ? `<picture>${marcaOscura}${marca}</picture>` : marca}</a>
    <a class="barra-tel" href="${telHref}" aria-label="Llamar al ${esc(P.telefonoCita.display)}">${icono('tel', 18)}<span>${esc(P.telefonoCita.display)}</span></a>`;
}

function renderHero(){
  document.getElementById('hero').innerHTML = `
    <p class="antetitulo entra" style="--i:0">${esc(P.antetitulo)}</p>
    <h1 id="titulo" class="entra" style="--i:1">${destacar(P.titulo)}</h1>
    <p class="bajada entra" style="--i:2">${esc(P.bajada)}</p>
    <div class="entra" style="--i:3">${cta()}</div>
    <p class="aviso-cita entra" style="--i:4">${icono('reloj', 18)} ${esc(P.avisoCita)}</p>
    ${P.honorarios ? `<p class="honorarios entra" style="--i:4">${esc(P.honorarios.texto)}${chip(!P.honorarios.confirmado)}</p>` : ''}
    <div class="entra" style="--i:5">${linkWhatsapp()}</div>`;
}

function renderTramites(){
  document.getElementById('tramites').innerHTML = P.tramites.map((t, n) => `
    <article class="tramite entra" style="--i:${3 + n}">
      <div class="tramite-cabeza">
        <span class="tramite-icono">${icono(t.icono, 22)}</span>
        <h2>${destacar(t.titulo)}</h2>
      </div>
      <p class="cuando">${esc(t.cuando)}</p>
      <ol class="pasos">${t.pasos.map((p, i) => `<li style="--i:${i}">${esc(p)}</li>`).join('')}</ol>
      <details class="papeles">
        <summary>${icono('chevron', 16)} Qué papeles traer a la cita</summary>
        <ul>${t.papeles.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      </details>
      <a class="tramite-accion" href="${telHref}">${esc(t.accion)} ${icono('flecha', 18)}</a>
    </article>`).join('');
}

function renderOtros(){
  const s = P.secundarios;
  const items = s.items.map(i =>
    `<span class="secundario"><strong>${esc(i.nombre)}</strong> <span class="${i.confirmado ? '' : 'dato-forma'}">${esc(i.detalle)}</span></span>`).join('');
  document.getElementById('otros').innerHTML = `
    <p class="secundarios"><span class="secundarios-intro">${esc(s.intro)}</span>${items}</p>
    <p class="otro-caso">${esc(P.otroCaso.pregunta)} <a href="${telHref}">${esc(P.otroCaso.accion)}</a></p>`;
}

function renderConfianza(){
  const m = P.matricula;
  const tieneMatricula = m.tomo && m.folio;
  const matricula = tieneMatricula ? `${esc(m.colegio)} · T° ${esc(m.tomo)} F° ${esc(m.folio)}` : esc(m.colegio);
  const r = P.rating;
  const estrellas = Array.from({ length: 5 }, () => icono('estrella', 15)).join('');
  const resenas = P.resenas.map(x => `
    <blockquote class="resena">“${esc(x.texto)}”
      <span class="resena-autor">${esc(x.autor)}${x.fecha ? ` · ${esc(x.fecha)}` : ''}${chip(x.ejemplo, 'reseña de ejemplo')}${chip(!x.ejemplo && x.confirmado === false)}</span>
    </blockquote>`).join('');
  const d = P.direccion;
  const mapsHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.mapsQuery)}`;
  const hayOpiniones = r && (r.total > 0 || P.resenas.length > 0);
  if (d.mapa){
    const { lat, lon } = d.mapa;
    const bbox = [lon - .0045, lat - .0028, lon + .0045, lat + .0028].map(n => n.toFixed(5)).join('%2C');
    const src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}`;
    const caja = document.getElementById('mapa');
    caja.innerHTML = `<iframe loading="lazy" title="Mapa: ${esc(d.linea)}, ${esc(d.ciudad)}" referrerpolicy="no-referrer"></iframe>`;
    const cargar = () => { caja.firstChild.src = src; };
    if ('IntersectionObserver' in window){
      const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ cargar(); io.disconnect(); } }, { rootMargin: '200px' });
      io.observe(caja);
    } else cargar();
  }
  document.getElementById('confianza').innerHTML = `
    <div class="fila fila-prof">${icono('persona')}<div>
      <span class="fila-titulo">${esc(P.profesional.etiqueta)}</span>
      <span class="fila-valor">${esc(P.profesional.nombre)}${chip(!P.profesional.confirmado)}</span>
      <span class="fila-valor" style="font-weight:500">${esc(m.etiqueta)} ${matricula}${chip(!tieneMatricula)}</span>
    </div></div>
    ${hayOpiniones ? `<div class="fila fila-opiniones">${icono('estrella')}<div>
      <span class="fila-titulo">Opiniones en Google</span>
      <span class="fila-valor"><span class="estrellas" aria-hidden="true">${estrellas}</span>
        <a href="${esc(r.url)}" target="_blank" rel="noopener">${r.valor.toFixed(1).replace('.', ',')} · ${r.total} opiniones</a></span>
      ${resenas}
    </div></div>` : ''}
    <div class="fila fila-dir">${icono('pin')}<div>
      <span class="fila-titulo">Dónde estamos</span>
      <span class="fila-valor"><a href="${mapsHref}" target="_blank" rel="noopener">${esc(d.linea)}</a></span>
      <span class="${d.detalle.confirmado ? '' : 'dato-forma'}">${esc(d.detalle.texto)}</span> · ${esc(d.ciudad)}
      ${d.cercania ? `<span class="cercania">${esc(d.cercania)}</span>` : ''}
    </div></div>`;
}

function renderCierre(){
  const hayFormas = [...P.secundarios.items, P.direccion.detalle].some(x => !x.confirmado);
  document.getElementById('cierre').innerHTML = `
    <h2>${esc(P.cierre.titulo)}</h2>
    <p class="aviso-cita">${icono('reloj', 18)} ${esc(P.avisoCita)}</p>
    ${cta()}
    <p class="letra-chica">${linkWhatsapp() ? `${linkWhatsapp()}<br>` : ''}${esc(P.nombre)} · ${esc(P.letraChica)}${hayFormas ? ' Los datos subrayados con puntos se confirman con el estudio.' : ''}</p>`;
}

/* ==========================================================================
   COLORES Y MOVIMIENTO
   ========================================================================== */
const VARS = { fondo:'--fondo', superficie:'--superficie', texto:'--texto', textoSec:'--texto-sec', acento:'--acento', acentoTexto:'--acento-texto', segundo:'--segundo', borde:'--borde', trama:'--trama' };
const oscuro = matchMedia('(prefers-color-scheme: dark)');
function applyColores(){
  const pal = CONFIG.colores[oscuro.matches ? 'oscuro' : 'claro'];
  for (const [k, v] of Object.entries(VARS)) if (pal[k]) document.documentElement.style.setProperty(v, pal[k]);
  document.querySelector('meta[name="theme-color"]').content = pal.fondo;
}

function init(){
  applyColores();
  oscuro.addEventListener?.('change', applyColores);
  if (P.favicon) document.head.insertAdjacentHTML('beforeend', `<link rel="icon" type="image/svg+xml" href="${esc(P.favicon)}">`);
  document.title = `${P.nombre} — ${P.titulo.replace(/\*/g, '').replace(/\.$/, '')}`;
  document.body.classList.toggle('con-trama', CONFIG.trama);
  if (CONFIG.animaciones) document.body.classList.add('animar');
  renderBarra(); renderHero(); renderTramites(); renderOtros(); renderConfianza(); renderCierre();

  // Los pasos de cada trámite aparecen al entrar en pantalla.
  const tarjetas = document.querySelectorAll('.tramite');
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } }), { threshold: .25 });
    tarjetas.forEach(t => io.observe(t));
  } else tarjetas.forEach(t => t.classList.add('visible'));
}
init();
</script>

<!-- =============================================================================
CÓMO PERSONALIZAR ESTE MOLDE PARA UN ESTUDIO NUEVO

  1. (1 min)  PROSPECTO.nombre, marca, antetitulo, titulo, bajada.
  2. (1 min)  PROSPECTO.telefonoCita (el número donde quiere que lo llamen) y
              avisoCita. Si no atiende sólo con cita, cambiar el texto.
  3. (1 min)  PROSPECTO.whatsapp: número, o mostrar: false si no lo quiere.
  4. (2 min)  PROSPECTO.tramites (exactamente 2 protagonistas): pasos y
              papeles en lenguaje de cliente, sin plazos.
  5. (1 min)  PROSPECTO.secundarios y otroCaso.
  6. (2 min)  Confianza: profesional, matricula (tomo y folio sólo si el
              estudio los da), rating y resenas. CRÍTICO: reemplazar la reseña
              de ejemplo por reseñas REALES de Google, o dejar resenas: [].
  7. (1 min)  PROSPECTO.direccion y honorarios.
  8. (30 seg) CONFIG.colores si el estudio tiene marca propia.
  9. (30 seg) Verificar a 375 px que nada desborda.

  No se toca el marcado (HTML) en ningún paso de esta lista.

CAMPOS OBLIGATORIOS vs OPCIONALES

  Obligatorios: nombre, marca, titulo, bajada, telefonoCita, tramites (2),
  profesional, direccion, CONFIG.colores.claro y .oscuro.
  Opcionales: logo, logoOscuro, favicon, antetitulo, whatsapp (mostrar: false),
  honorarios (null), secundarios.items, matricula.tomo/folio, rating, resenas
  (sin opiniones ni reseñas, el bloque no se muestra), direccion.cercania y
  direccion.mapa.

REGLAS DE TEXTO PARA ABOGADOS (publicidad profesional)

  Nunca: plazos ("en 30 días"), "garantizado", precios, "consulta gratis",
  "sin cargo", "sin compromiso", "especialistas" sin especialidad acreditada,
  "asesoramiento integral". Ver la investigación del cliente que originó el
  molde para las fuentes.

HIPÓTESIS DE TEST A/B PARA LA SIGUIENTE ITERACIÓN

  1. Título con "exprés" vs. "de común acuerdo": medir clics en la llamada.
  2. Link de WhatsApp visible vs. oculto: medir si baja la tasa de llamadas o
     sólo suma consultas que no se convierten en cita.
  3. Papeles a traer abiertos vs. plegados: medir si adelantar la lista
     aumenta las llamadas desde la tarjeta.

============================================================================= -->
</body>
</html>
